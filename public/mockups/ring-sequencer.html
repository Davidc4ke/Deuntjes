<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>Deuntjes — the Ritual Ring</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Pirata+One&family=IM+Fell+English:ital@0;1&family=Space+Mono:wght@700&display=swap" rel="stylesheet" />
<style>
  :root {
    --void: #050505; --iron: #101010; --iron-2: #181818;
    --ink: #f2ede3; --ink-dim: #b3ac9d; --smoke: #7d7768;
    --blood: #a01818; --blood-lit: #d42121; --blood-dark: #5c0d0d;
    --parch: #efe9db; --parch-ink: #151210;
    --display: "UnifrakturCook", "Pirata One", serif;
    --gothic: "Pirata One", serif;
    --body: "IM Fell English", Georgia, serif;
  }
  /* touch-action: manipulation kills iOS double-tap zoom on every control
     (double-pressing chord chips was zooming the page); the ring svg
     overrides with touch-action: none for the wind gesture */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: radial-gradient(130% 90% at 50% -20%, #141414, var(--void) 55%);
    color: var(--ink); font-family: var(--body);
    user-select: none; -webkit-user-select: none;
  }
  button { font-family: inherit; cursor: pointer; }

  .app {
    height: 100dvh; max-width: 540px; margin: 0 auto;
    display: flex; flex-direction: column;
    padding: calc(8px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom));
    overflow: hidden;
  }

  .curse-strip {
    display: flex; align-items: center; gap: 9px;
    background: linear-gradient(180deg, #f4efe2, #ddd5c2); color: var(--parch-ink);
    padding: 6px 11px; margin-bottom: 8px; transform: rotate(-.5deg);
    clip-path: polygon(0 8%, 2% 0, 98% 3%, 100% 14%, 99% 90%, 96% 100%, 3% 97%, 0 88%);
    font-size: 12px; font-style: italic; flex-shrink: 0;
  }
  .curse-strip b { font-family: var(--display); font-style: normal; font-size: 14px; margin-right: 2px; }

  .chips-row { display: flex; gap: 6px; margin-bottom: 6px; flex-shrink: 0; align-items: stretch; }
  .track-chips { display: flex; gap: 6px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .track-chips::-webkit-scrollbar { display: none; }
  .tchip {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 5px;
    background: #0d0d0d; border: 1px solid rgba(242,237,227,.16); border-radius: 3px;
    color: var(--smoke); font: 400 12px var(--gothic); letter-spacing: .04em; padding: 8px 9px;
  }
  .tchip .sw { width: 9px; height: 9px; border: 1px solid rgba(242,237,227,.5); flex-shrink: 0; }
  .tchip.active { color: var(--parch-ink); background: linear-gradient(180deg, #f4efe2, #ddd5c2); border-color: #000; }
  .tchip .eye { background: none; border: none; padding: 1px; color: inherit; display: inline-flex; }
  .tchip.hidden-track .sw, .tchip.hidden-track .nm { opacity: .3; }
  .pat-0 { background-image: repeating-linear-gradient(45deg, rgba(242,237,227,.95) 0 1px, transparent 1px 4px), repeating-linear-gradient(-45deg, rgba(242,237,227,.95) 0 1px, transparent 1px 4px); }
  .pat-1 { background-image: repeating-linear-gradient(0deg, rgba(242,237,227,.95) 0 2px, transparent 2px 5px); }
  .pat-2 { background-image: repeating-linear-gradient(45deg, rgba(242,237,227,.95) 0 1.5px, transparent 1.5px 5px); }
  .pat-3 { background-image: radial-gradient(rgba(242,237,227,.95) 1px, transparent 1.4px); background-size: 5px 5px; }
  .pat-4 { background-image: repeating-linear-gradient(90deg, rgba(242,237,227,.95) 0 2px, transparent 2px 5px); }
  .tchip.active .sw { filter: invert(1); border-color: rgba(21,18,16,.7); }
  .icon-chip {
    flex: 0 0 42px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, var(--iron-2), var(--iron)); color: var(--ink-dim);
    border: 1px solid rgba(242,237,227,.22); border-radius: 3px; font-size: 16px;
  }
  .icon-chip.lit { color: var(--ink); border-color: var(--blood-lit); box-shadow: 0 0 12px rgba(212,33,33,.3); }

  .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  .stage svg { max-width: 100%; max-height: 100%; display: block; }
  .stage .fx-layer { position: absolute; inset: 0; margin: auto; pointer-events: none; }
  .stage .main-layer { position: relative; z-index: 1; touch-action: none; }

  .status-row {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    font-size: 11.5px; font-style: italic; color: var(--smoke); flex-shrink: 0; padding: 2px 0 4px;
  }
  .status-row button { background: none; border: 1px solid rgba(242,237,227,.25); border-radius: 3px; color: var(--ink-dim); font-size: 12px; padding: 1px 8px; }
  .status-row b { font-family: var(--gothic); font-weight: 400; color: var(--ink-dim); font-style: normal; letter-spacing: .05em; }

  /* decorative spinners live on the static fx-layer so playback re-renders
     never restart their animation */
  .spin-slow { animation: spin 60s linear infinite; }
  .spin-rev { animation: spin 42s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .b-step { fill: #0d0d0d; stroke: rgba(242,237,227,.32); stroke-width: 1.6; }
  .b-step.accent { stroke: rgba(242,237,227,.5); }
  .b-step.on { fill: var(--parch); stroke: #000; }
  .b-step.sel { stroke: var(--blood-lit); stroke-width: 3; }
  .b-step.playhead { stroke: var(--ink); stroke-width: 3; filter: drop-shadow(0 0 6px rgba(242,237,227,.7)); }
  .b-lab { font-family: var(--gothic); fill: var(--smoke); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .b-lab.on { fill: var(--parch-ink); }
  .b-ghost { fill: rgba(242,237,227,.5); }
  .b-rune-ring { fill: none; stroke: rgba(242,237,227,.2); stroke-dasharray: 1 7; }
  .b-rune-ring.r2 { stroke: rgba(212,33,33,.25); stroke-dasharray: 1 11; }
  .b-hand { stroke: rgba(212,33,33,.85); stroke-width: 2.5; stroke-linecap: round; filter: drop-shadow(0 0 5px rgba(212,33,33,.8)); }
  .b-hand.idle { stroke: rgba(242,237,227,.3); filter: none; stroke-dasharray: 3 5; }
  .b-cursor-notch { fill: none; stroke: var(--blood-lit); stroke-width: 2; stroke-dasharray: 4 4; }
  .b-lenarc { fill: none; stroke: rgba(239,233,219,.4); stroke-linecap: round; }
  .b-focusring { fill: none; stroke: transparent; cursor: pointer; }
  .bar-tag { fill: #101010; stroke: rgba(242,237,227,.4); stroke-width: 1.2; }
  .bar-tag.focus { fill: var(--parch); stroke: #000; }
  /* roman numerals in blackletter are unreadable (I looks like J) — use the
     Fell serif for anything numeric that stands alone */
  .bar-tag-lab { font-family: var(--body); font-style: italic; fill: var(--ink-dim); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .bar-tag-lab.focus { fill: var(--parch-ink); }

  .play-core { fill: url(#playGrad); stroke: var(--blood-dark); stroke-width: 1.5; }
  .play-halo { fill: none; stroke: rgba(212,33,33,.5); }
  .play-halo.pulse { animation: halo 2.4s ease-in-out infinite; }
  @keyframes halo { 0%,100% { opacity: .25; } 50% { opacity: .75; } }
  .play-glyph { fill: var(--ink); pointer-events: none; }

  /* instrument wheel */
  .p-stone { fill: #12100d; stroke: rgba(242,237,227,.35); stroke-width: 1.5; }
  .p-stone.cur { fill: var(--parch); stroke: var(--blood-lit); stroke-width: 2.5; }
  .p-lab { font-family: var(--gothic); fill: var(--ink-dim); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .p-lab.cur { fill: var(--parch-ink); }
  .fx-arc-bg { fill: none; stroke: rgba(242,237,227,.15); stroke-width: 10; stroke-linecap: round; }
  .fx-arc-fill { fill: none; stroke: var(--blood-lit); stroke-width: 10; stroke-linecap: round; filter: drop-shadow(0 0 6px rgba(212,33,33,.5)); }
  .fx-arc-hit { fill: none; stroke: transparent; stroke-width: 34; cursor: pointer; }
  .fx-lab { font: italic 10px var(--body); fill: var(--smoke); text-anchor: middle; }
  .inst-title { font-family: var(--display); fill: var(--ink); text-anchor: middle; }
  .inst-sub { font: italic 10.5px var(--body); fill: var(--smoke); text-anchor: middle; }

  /* ===== pickers ===== */
  .pickers { flex-shrink: 0; border-top: 1px solid rgba(242,237,227,.1); padding-top: 6px; }
  .pick-status { font-size: 11.5px; font-style: italic; color: var(--smoke); text-align: center; margin: 0 0 6px; min-height: 14px; }
  .pick-status b { color: var(--ink-dim); font-style: normal; font-family: var(--gothic); font-weight: 400; letter-spacing: .05em; }

  /* key-dot piano (matches the app's sequencer keyboard) */
  .piano-wrap { overflow-x: auto; scrollbar-width: none; padding: 2px 0 7px; }
  .piano-wrap::-webkit-scrollbar { display: none; }
  .piano { position: relative; height: 80px; }
  .pk-w, .pk-b {
    position: absolute; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font: 700 10px "Space Mono", ui-monospace, monospace; letter-spacing: .03em; text-transform: uppercase;
    transition: transform .15s ease;
  }
  .pk-w:active, .pk-b:active { transform: scale(.92); }
  .pk-w {
    top: 38px; width: 40px; height: 40px;
    background: radial-gradient(circle at 35% 30%, #fbf6e6 0%, #ebe5d3 70%, #d6d0bd 100%);
    color: rgba(21,18,16,.8); border: 1px solid #b8b0a0;
    box-shadow: inset 0 1px 1px rgba(255,255,255,.7), inset 0 -2px 3px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.5);
  }
  .pk-b {
    top: 0; width: 34px; height: 34px; z-index: 2; font-size: 8.5px;
    background: radial-gradient(circle at 35% 30%, #2c2c2c 0%, #141414 70%, #060606 100%);
    color: var(--ink-dim); border: 1px solid #000;
    box-shadow: inset 0 1px 1px rgba(255,255,255,.15), inset 0 -2px 3px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.6);
  }
  .pk-w.sticky, .pk-b.sticky {
    background: radial-gradient(circle at 35% 30%, #e5473a 0%, var(--blood) 70%, var(--blood-dark) 100%);
    color: var(--ink); border-color: var(--blood-dark);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 0 10px rgba(212,33,33,.5);
  }

  .strip { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 7px; scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .nbtn {
    flex-shrink: 0; height: 38px; min-width: 40px; padding: 0 9px; border-radius: 999px;
    background: #0d0d0d; border: 1.5px solid rgba(242,237,227,.25); color: var(--ink-dim);
    font: 400 12.5px var(--gothic); letter-spacing: .03em;
  }
  .nbtn.black { background: #000; color: var(--smoke); }
  .nbtn.sticky { background: linear-gradient(180deg, #f4efe2, #ddd5c2); color: var(--parch-ink); border-color: #000; }
  .nbtn.util { border-style: dashed; font-size: 11px; }
  .drum-note { text-align: center; color: var(--smoke); font-style: italic; font-size: 12px; padding: 16px 10px; }
  .len-row { display: flex; gap: 6px; align-items: center; padding: 0 2px 2px; }
  .len-row .lab, .strip-label { font: 400 9.5px var(--gothic); letter-spacing: .14em; text-transform: uppercase; color: rgba(242,237,227,.35); padding: 0 4px 2px; }
  .len-row .nbtn { height: 30px; min-width: 34px; font-size: 11.5px; }

  /* instrument parameter sections (Voice / Tone / EQ / FX like the app) */
  .ptabs { display: flex; gap: 6px; padding: 0 2px 8px; }
  .ptabs button {
    flex: 1; background: #0d0d0d; border: 1px solid rgba(242,237,227,.2); border-radius: 3px;
    color: var(--smoke); font: 400 12px var(--gothic); letter-spacing: .08em; text-transform: uppercase; padding: 7px 4px;
  }
  .ptabs button.cur { background: linear-gradient(180deg, #f4efe2, #ddd5c2); color: var(--parch-ink); border-color: #000; }
  .prow { display: flex; align-items: center; gap: 9px; padding: 2px 4px 7px; }
  .prow label { width: 64px; font: 400 12px var(--gothic); letter-spacing: .05em; color: var(--ink-dim); flex-shrink: 0; }
  .prow input[type=range] { flex: 1; accent-color: var(--blood-lit); min-width: 0; }
  .prow output { width: 30px; text-align: right; font-size: 11px; color: var(--smoke); flex-shrink: 0; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="curse-strip"><b>Minor Key</b> — only notes from a minor scale.</div>
  <div class="chips-row">
    <div class="track-chips"></div>
    <button class="icon-chip" data-act="inst" title="Instrument">⚙&#xFE0E;</button>
    <button class="icon-chip" data-act="clear" title="Clear track">✕</button>
  </div>
  <div class="stage">
    <svg class="fx-layer" viewBox="0 0 372 372"></svg>
    <svg class="main-layer" viewBox="0 0 372 372"></svg>
  </div>
  <div class="status-row">
    <span class="pos-lab-html">bar I · step 1</span>
  </div>
  <div class="pickers">
    <p class="pick-status"></p>
    <div class="pick-body"></div>
  </div>
</div>

<script>
// ================= notes, chords =================
const NOTE_ORDER = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const parseN = (n) => { const m = /^([A-G]#?)(\d)$/.exec(n); return { semi: NOTE_ORDER.indexOf(m[1]), oct: +m[2] }; };
const midi = (n) => { const p = parseN(n); return (p.oct + 1) * 12 + p.semi; };
const fromMidi = (v) => NOTE_ORDER[v % 12] + (Math.floor(v / 12) - 1);
const noteFreq = (n) => 440 * Math.pow(2, (midi(n) - 69) / 12);
const clone = (o) => JSON.parse(JSON.stringify(o));

const CHORD_QUALITIES = [
  { id: 'maj', label: 'maj', suffix: '', iv: [0,4,7] }, { id: 'min', label: 'min', suffix: 'm', iv: [0,3,7] },
  { id: '7', label: '7', suffix: '7', iv: [0,4,7,10] }, { id: 'maj7', label: 'maj7', suffix: 'M7', iv: [0,4,7,11] },
  { id: 'm7', label: 'm7', suffix: 'm7', iv: [0,3,7,10] }, { id: '6', label: '6', suffix: '6', iv: [0,4,7,9] },
  { id: 'm6', label: 'm6', suffix: 'm6', iv: [0,3,7,9] }, { id: 'sus2', label: 'sus2', suffix: 'sus2', iv: [0,2,7] },
  { id: 'sus4', label: 'sus4', suffix: 'sus4', iv: [0,5,7] }, { id: 'dim', label: 'dim', suffix: 'dim', iv: [0,3,6] },
  { id: 'dim7', label: 'dim7', suffix: '°7', iv: [0,3,6,9] }, { id: 'm7b5', label: 'm7♭5', suffix: 'ø7', iv: [0,3,6,10] },
  { id: 'aug', label: 'aug', suffix: '+', iv: [0,4,8] }, { id: '5', label: '5', suffix: '5', iv: [0,7] },
  { id: 'add9', label: 'add9', suffix: 'add9', iv: [0,4,7,14] }, { id: '9', label: '9', suffix: '9', iv: [0,4,7,10,14] },
  { id: 'maj9', label: 'maj9', suffix: 'M9', iv: [0,4,7,11,14] }, { id: 'm9', label: 'm9', suffix: 'm9', iv: [0,3,7,10,14] },
  { id: '11', label: '11', suffix: '11', iv: [0,4,7,10,14,17] }, { id: '13', label: '13', suffix: '13', iv: [0,4,7,10,14,21] },
];
const INVERSIONS = ['root', '1st', '2nd'];
function buildChord(cfg, len = 4) {
  const q = CHORD_QUALITIES.find(x => x.id === cfg.qual);
  const root = (cfg.oct + 1) * 12 + NOTE_ORDER.indexOf(cfg.root);
  let vals = q.iv.map(i => root + i);
  for (let i = 0; i < Math.min(cfg.inv, vals.length - 1); i++) vals[i] += 12;
  vals.sort((a, b) => a - b);
  return { label: cfg.root + q.suffix, notes: vals.map(fromMidi), len, cfg: clone(cfg) };
}
const N = (label, len = 1) => ({ label, notes: [label], len });

// ================= channels (lots of them) =================
const ALLOWED = {
  drum: ['Kick', '808', 'Snare', 'Clap', 'Hat', 'Open Hat', 'Tom', 'Perc', 'Rim', 'Crash', 'Ride'],
  melodic: ['Bass', 'Sub', 'Acid', 'Reese', 'Lead', 'Pluck', 'Bell', 'Marimba', 'Keys'],
  chord: ['Pad', 'Keys', 'Organ', 'Strings', 'Choir', 'Bell'],
};
// two drum kits: the plain bone kit, and a proper 80s drum machine
const DRUM_KITS = {
  'Bone Kit': ALLOWED.drum,
  'Neon 808': ['808 Kick', '808 Snare', '808 Clap', '808 Hat', '808 Open', '808 Tom', 'Cowbell', 'Rimshot', 'Maracas'],
};
const TIMBRE = {
  Kick: ['sine', .1], '808': ['sine', .3], Snare: ['square', .05], Clap: ['square', .06],
  Hat: ['square', .03], 'Open Hat': ['square', .12], Tom: ['sine', .12], Perc: ['sine', .06],
  Rim: ['square', .03], Crash: ['sawtooth', .4], Ride: ['sawtooth', .2],
  Bass: ['square', .16], Sub: ['sine', .2], Acid: ['sawtooth', .12], Reese: ['sawtooth', .2],
  Lead: ['triangle', .15], Pluck: ['triangle', .08], Bell: ['sine', .35], Marimba: ['sine', .12], Keys: ['triangle', .18],
  Pad: ['sine', .4], Organ: ['square', .3], Strings: ['sawtooth', .38], Choir: ['sine', .45],
};
const defaultParams = () => ({
  attack: .05, decay: .2, sustain: .6, release: .3,
  cutoff: .8, resonance: .1, pan: .5, glide: 0,
  low: .5, mid: .5, high: .5,
  reverb: .15, delay: 0, chorus: 0, drive: 0,
});
// barsN = loop length in bars for THIS channel. A 1-bar kick loops while a
// 2-bar chord progression walks on — independent loops, clip-style.
const CH = (key, name, kind, preset, steps = {}, barsN = 2) => ({ key, name, kind, preset, steps, barsN });
const BARS_CHOICES = [1, 2, 3];
const state = {
  tracks: [
    CH('kick',  'Kick',  'drum', 'Kick',  { 0: N('C2'), 4: N('C2'), 8: N('C2'), 12: N('C2') }, 1),
    CH('snare', 'Snare', 'drum', 'Snare', { 4: N('C2'), 12: N('C2') }, 1),
    CH('hats',  'Hats',  'drum', 'Hat',   { 2: N('C2'), 6: N('C2'), 10: N('C2'), 14: N('C2') }, 1),
    CH('perc',  'Perc',  'drum', 'Perc',  { 7: N('C2'), 23: N('C2') }, 2),
    CH('bass',  'Bass',  'melodic', 'Bass', { 0: N('C2', 2), 6: N('G1'), 8: N('C2', 2), 14: N('A#1'), 16: N('C2', 2), 22: N('D#2'), 24: N('C2'), 30: N('G1') }, 2),
    CH('sub',   'Sub',   'melodic', 'Sub',  { 0: N('C1', 8), 16: N('G1', 8) }, 2),
    CH('lead',  'Lead',  'melodic', 'Lead', {}, 2),
    CH('arp',   'Arp',   'melodic', 'Pluck', { 1: N('C4'), 3: N('D#4'), 5: N('G4'), 9: N('C5'), 11: N('G4'), 13: N('D#4') }, 1),
    CH('chord', 'Chord', 'chord', 'Pad', { 0: buildChord({ root: 'C', qual: 'min', oct: 3, inv: 0 }), 8: buildChord({ root: 'G', qual: '7', oct: 2, inv: 0 }), 16: buildChord({ root: 'D#', qual: 'maj7', oct: 3, inv: 0 }), 24: buildChord({ root: 'A#', qual: 'maj', oct: 2, inv: 0 }) }, 2),
    CH('pads',  'Pads',  'chord', 'Strings', { 0: buildChord({ root: 'C', qual: '5', oct: 2, inv: 0 }, 8), 16: buildChord({ root: 'A#', qual: '5', oct: 1, inv: 0 }, 8) }, 2),
  ],
  activeKey: 'chord',
  hidden: new Set(['sub', 'perc']),
  stickyEv: {},
  chordCfg: { root: 'C', qual: 'min', oct: 3, inv: 0 },
  sel: null,
  cursor: 0,
  focusedBar: 0,
  view: 'steps',
  instTab: 'voice',
  preset: {},
  params: {},
};
state.drumKit = {};
state.tracks.forEach((t, i) => {
  t.pat = 'pat-' + (i % 5);
  state.preset[t.key] = t.preset;
  state.params[t.key] = defaultParams();
  if (t.kind === 'drum') state.drumKit[t.key] = 'Bone Kit';
  state.stickyEv[t.key] = t.kind === 'chord'
    ? buildChord({ root: 'C', qual: 'min', oct: 3, inv: 0 })
    : N(t.kind === 'drum' ? 'C2' : 'C4');
});
// 16 steps per bar for everyone; channels differ in how many BARS they loop.
// The transport walks the LCM of all loop lengths; each channel plays
// (globalStep mod its own length) — short loops repeat while long ones roam.
const STEP_MS = 125;
const trackSteps = (t) => t.barsN * 16;
const gcd = (a, b) => (b ? gcd(b, a % b) : a);
const songSteps = () => state.tracks.reduce((l, t) => (l * t.barsN) / gcd(l, t.barsN), 1) * 16;
const active = () => state.tracks.find(t => t.key === state.activeKey);
const others = () => state.tracks.filter(t => t.key !== state.activeKey && !state.hidden.has(t.key));

// ================= audio =================
let AC = null, noiseBuf = null;
function noiseSrc() {
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const s = AC.createBufferSource();
  s.buffer = noiseBuf; s.loop = true;
  return s;
}
function envGain(t, peak, dur) {
  const g = AC.createGain();

// ================= animated layout =================
let L = { rings: [], inst: 0 };
function targetLayout() {
  const f = state.focusedBar;
  const rings = [];
  for (let b = 0; b < active().barsN; b++) {
    if (b === f) rings.push({ r: 146, s: 1 });
    else if (b < f) rings.push({ r: 174 - (f - 1 - b) * 13, s: .42 });
    else rings.push({ r: 146 - 44 * (b - f), s: b - f === 1 ? .6 : .42 });
  }

}
let animId = 0;
function settle(instant = false) {
  const from = clone(L), to = targetLayout();
  while (from.rings.length < to.rings.length) from.rings.push({ r: 40, s: 0 });
  from.rings.length = to.rings.length;
  if (instant) { L = to; renderRing(); return; }

  const ease = (x) => 1 - Math.pow(1 - x, 3);

    const k = ease(Math.min(1, (now - t0) / MS));
    L = {
      inst: from.inst + (to.inst - from.inst) * k,
      rings: to.rings.map((tr, i) => ({
        r: from.rings[i].r + (tr.r - from.rings[i].r) * k,
        s: from.rings[i].s + (tr.s - from.rings[i].s) * k,
      })),

let timer = null, gPos = -1; // global 16th index over the LCM of all loops
function stopPlay() { if (timer) clearInterval(timer); timer = null; gPos = -1; renderRing(); }
function togglePlay() {
  if (timer) { stopPlay(); return; }
  let pos = state.cursor % trackSteps(active());
  gPos = pos;
  timer = setInterval(() => {
    state.tracks.forEach(t => {
      const ev = t.steps[pos % trackSteps(t)];
      if (ev) playEvent(t, ev);
    });
    gPos = pos;
    const bar = Math.floor((pos % trackSteps(active())) / 16);
    if (bar !== state.focusedBar) { state.focusedBar = bar; settle(); }
    renderRing();
    pos = (pos + 1) % songSteps();
  }, STEP_MS);

function renderRing() {
  const t = active();

  let out = `<defs>

      <stop offset="0%" stop-color="#e5473a"/><stop offset="55%" stop-color="#a01818"/><stop offset="100%" stop-color="#4a0b0b"/>

        <div class="piano-wrap"><div class="piano" style="width:${wx + 4}px">${whites}${blacks}</div></div>
        ${lenRow}${beatsRow}`;
      if (pianoScrolledFor !== t.key) {
        pianoScrolledFor = t.key;
        const wrap = pickBody.querySelector('.piano-wrap');
        const kEl = wrap.querySelector('.pk-w.sticky, .pk-b.sticky');
        if (kEl) wrap.scrollLeft = Math.max(0, kEl.offsetLeft - wrap.clientWidth / 2);
      }
    }
  });
}
function applySticky() {
  const t = active();
  if (t.kind === 'chord') {
    const len = state.stickyEv[t.key].len || 4;
    state.stickyEv[t.key] = buildChord(state.chordCfg, len);
  }
  const ev = clone(state.stickyEv[t.key]);
  if (state.sel !== null && t.steps[state.sel]) t.steps[state.sel] = ev;
  playEvent(t, ev);
  renderRing(); renderPickers();
}
pickBody.addEventListener('click', (e) => {
  const t = active();
  const ptab = e.target.closest('[data-ptab]');
  if (ptab) { state.instTab = ptab.dataset.ptab; renderPickers(); return; }
  const kit = e.target.closest('[data-kit]');
  if (kit) {
    state.drumKit[t.key] = kit.dataset.kit;
    if (!DRUM_KITS[kit.dataset.kit].includes(state.preset[t.key])) {
      state.preset[t.key] = DRUM_KITS[kit.dataset.kit][0];
    }
    playEvent(t, state.stickyEv[t.key]);
    renderRing(); renderPickers(); return;
  }
  const barsn = e.target.closest('[data-barsn]');
  if (barsn) {
    // change how many bars this channel's loop spans
    t.barsN = +barsn.dataset.barsn;
    state.cursor = state.cursor % trackSteps(t);
    state.focusedBar = Math.min(state.focusedBar, t.barsN - 1);
    if (state.sel !== null && state.sel >= trackSteps(t)) state.sel = null;
    settle(); renderPickers(); return;
  }
  const note = e.target.closest('[data-note]');
  if (note) {
    if (t.kind === 'chord') {
      // piano key = chord root AND octave in one tap
      const p = parseN(note.dataset.note);
      state.chordCfg.root = NOTE_ORDER[p.semi];
      state.chordCfg.oct = p.oct;
    } else {
      const len = state.stickyEv[t.key].len || 1;
      state.stickyEv[t.key] = N(note.dataset.note, len);
    }
    applySticky(); return;
  }
  const qual = e.target.closest('[data-qual]');
  if (qual) { state.chordCfg.qual = qual.dataset.qual; applySticky(); return; }
  const inv = e.target.closest('[data-inv]');
  if (inv) { state.chordCfg.inv = (state.chordCfg.inv + 1) % INVERSIONS.length; applySticky(); return; }
  const len = e.target.closest('[data-len]');
  if (len) { state.stickyEv[t.key].len = +len.dataset.len; applySticky(); return; }
});
pickBody.addEventListener('input', (e) => {
  const r = e.target.closest('[data-param]');
  if (!r) return;
  state.params[active().key][r.dataset.param] = r.value / 100;
  r.nextElementSibling.textContent = r.value;
  if (state.view === 'inst') renderRing(); // arcs mirror reverb/drive
});
pickBody.addEventListener('change', (e) => {
  const r = e.target.closest('[data-param]');
  if (r) playEvent(active(), state.stickyEv[active().key]);
});

// ================= ring interaction =================
let dragY = null, dragged = false, dragStartCursor = 0, arcDrag = null;
svg.addEventListener('pointerdown', (e) => {
  const arc = e.target.closest('[data-arc]');
  if (arc) {
    arcDrag = { key: arc.dataset.arc, a0: +arc.dataset.a0, a1: +arc.dataset.a1 };
    try { svg.setPointerCapture(e.pointerId); } catch (_) {}
    setArcFromPointer(e);
    return;
  }
  if (state.view !== 'steps') return;
  dragY = e.clientY; dragged = false; dragStartCursor = state.cursor;
});
function setArcFromPointer(e) {
  const rect = svg.getBoundingClientRect();
  const sx = 372 / rect.width;
  const x = (e.clientX - rect.left) * sx - CX;
  const y = (e.clientY - rect.top) * sx - CY;
  let a = Math.atan2(y, x) * 180 / Math.PI;
  if (a < 0) a += 360;
  const { key, a0, a1 } = arcDrag;
  state.params[active().key][key] = Math.min(1, Math.max(0, (a - a0) / (a1 - a0)));
  renderRing(); renderPickers();
}
svg.addEventListener('pointermove', (e) => {
  if (arcDrag) { setArcFromPointer(e); return; }
  if (dragY === null) return;
  const dy = e.clientY - dragY;
  if (!dragged && Math.abs(dy) > 10) {
    dragged = true;
    try { svg.setPointerCapture(e.pointerId); } catch (_) {}
  }
  if (dragged) {
    const n = trackSteps(active());
    const delta = Math.round(dy / 22);
    state.cursor = ((dragStartCursor + delta) % n + n) % n;
    const bar = Math.floor(state.cursor / 16);
    if (bar !== state.focusedBar && !timer) { state.focusedBar = bar; settle(); }
    renderRing();
  }
});
window.addEventListener('pointerup', () => { dragY = null; arcDrag = null; });
svg.addEventListener('click', (e) => {
  if (dragged) { dragged = false; return; }
  if (e.target.closest('[data-play]')) { togglePlay(); return; }
  if (e.target.closest('[data-instdone]')) { closeInst(); return; }
  const preset = e.target.closest('[data-preset]');
  if (preset) {
    state.preset[active().key] = preset.dataset.preset;
    playEvent(active(), state.stickyEv[active().key]);
    renderRing(); renderPickers();
    return;
  }
  const focusRing = e.target.closest('[data-focus]');
  if (focusRing) {
    state.focusedBar = +focusRing.dataset.focus;
    settle();
    return;
  }
  const st = e.target.closest('[data-s]');
  if (!st || state.view !== 'steps') return;
  const s = +st.dataset.s;
  const bar = Math.floor(s / 16);
  if (bar !== state.focusedBar) { state.focusedBar = bar; settle(); return; }
  const t = active();
  if (!t.steps[s]) {
    if (t.kind === 'chord') state.stickyEv[t.key] = buildChord(state.chordCfg, state.stickyEv[t.key].len || 4);
    t.steps[s] = clone(state.stickyEv[t.key]);
    state.sel = s;
    playEvent(t, t.steps[s]);
  } else if (state.sel === s) {
    delete t.steps[s];
    state.sel = null;
  } else {
    state.sel = s;
    state.stickyEv[t.key] = clone(t.steps[s]);
    if (t.kind === 'chord' && t.steps[s].cfg) state.chordCfg = clone(t.steps[s].cfg);
    playEvent(t, t.steps[s]);
  }
  renderRing(); renderPickers();
});
svg.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (state.view !== 'steps') return;
  const n = trackSteps(active());
  state.cursor = ((state.cursor + (e.deltaY > 0 ? 1 : -1)) % n + n) % n;
  const bar = Math.floor(state.cursor / 16);
  if (bar !== state.focusedBar && !timer) { state.focusedBar = bar; settle(); }
  renderRing();
}, { passive: false });

// ================= instrument view =================
const instBtn = app.querySelector('[data-act="inst"]');
function openInst() { stopPlay(); state.view = 'inst'; state.sel = null; instBtn.classList.add('lit'); settle(); renderPickers(); }
function closeInst() { state.view = 'steps'; instBtn.classList.remove('lit'); settle(); renderPickers(); }
instBtn.addEventListener('click', () => { state.view === 'inst' ? closeInst() : openInst(); });

// ================= chrome =================
const chips = app.querySelector('.track-chips');
function renderChips() {
  chips.innerHTML = state.tracks.map(t => `
    <div class="tchip ${t.key === state.activeKey ? 'active' : ''} ${state.hidden.has(t.key) ? 'hidden-track' : ''}" data-k="${t.key}">
      <i class="sw ${t.pat}"></i><span class="nm">${t.name}</span>
      <button class="eye" data-eye="${t.key}">${state.hidden.has(t.key)
        ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l18 18M10.5 10.6a2.3 2.3 0 0 0 3 3M7 7.2C4.7 8.6 3 12 3 12s3.5 6 9 6c1.6 0 3-.4 4.2-1M10 6.2C10.6 6.1 11.3 6 12 6c5.5 0 9 6 9 6s-.7 1.3-2 2.7"/></svg>'
        : '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z"/><circle cx="12" cy="12" r="2.4"/></svg>'}</button>
    </div>`).join('');
  // keep the active chip in view (direct scroll, no smooth-jacking)
  const act = chips.querySelector('.tchip.active');
  if (act && (act.offsetLeft < chips.scrollLeft || act.offsetLeft + act.offsetWidth > chips.scrollLeft + chips.clientWidth)) {
    chips.scrollLeft = Math.max(0, act.offsetLeft - chips.clientWidth / 2 + act.offsetWidth / 2);
  }
}
chips.addEventListener('click', (e) => {
  const eye = e.target.closest('[data-eye]');
  if (eye) {
    const k = eye.dataset.eye;
    if (k !== state.activeKey) state.hidden.has(k) ? state.hidden.delete(k) : state.hidden.add(k);
    renderChips(); renderRing(); return;
  }
  const chip = e.target.closest('.tchip');
  if (chip) {
    state.activeKey = chip.dataset.k;
    state.hidden.delete(chip.dataset.k);
    state.sel = null;
    // fold the wound position into the new channel's loop length
    state.cursor = state.cursor % trackSteps(active());
    state.focusedBar = Math.min(Math.floor(state.cursor / 16), active().barsN - 1);
    renderChips(); settle(); renderPickers();
  }
});
app.querySelector('[data-act="clear"]').addEventListener('click', () => {
  active().steps = {}; state.sel = null; renderRing(); renderPickers();
});
renderChips();
settle(true);
renderPickers();
</script>
</body>
</html>
